# =============================================================================
# OpenShift - Ubuntu Persistent Pod Deployment
# =============================================================================
# Resources:
#   CPU     : 2 vCPUs
#   Memory  : 8 Gi
#   Storage : 64 Gi (PersistentVolumeClaim)
#
# Tooling installed at pod start-up:
#   - oc        (OpenShift CLI — stable release, includes bundled kubectl)
#   - kubectl   (extracted from the oc tarball)
#   - helm      (Helm 3 — latest via official install script)
#   - jq        (via apt)
#
# Prerequisites:
#   - An OpenShift cluster with a dynamic StorageClass available.
#   - Update `storageClassName` below to match your cluster's StorageClass
#     (e.g., ocs-storagecluster-ceph-rbd, thin-csi, gp2-csi).
#   - Grant the anyuid SCC to the service account so the Ubuntu container
#     can run (Ubuntu base image runs as root by default):
#
#       oc adm policy add-scc-to-user anyuid \
#         -z ubuntu-sa \
#         -n ubuntu-workspace
#
# Deploy:
#   oc apply -f openshift-ubuntu-persistent-pod.yaml
#
# Access the running pod:
#   oc exec -it deploy/ubuntu-persistent -n ubuntu-workspace -- /bin/bash
# =============================================================================

---
# 1. Namespace / OpenShift Project
apiVersion: v1
kind: Namespace
metadata:
  name: ubuntu-workspace
  labels:
    app: ubuntu-persistent

---
# 2. Dedicated ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ubuntu-sa
  namespace: ubuntu-workspace

---
# 3. PersistentVolumeClaim — 64 Gi block storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ubuntu-pvc
  namespace: ubuntu-workspace
  labels:
    app: ubuntu-persistent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Gi
  storageClassName: ocs-storagecluster-ceph-rbd  # <-- Update to match your StorageClass

---
# 4. Deployment — Ubuntu 22.04 LTS persistent pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubuntu-persistent
  namespace: ubuntu-workspace
  labels:
    app: ubuntu-persistent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu-persistent
  strategy:
    type: Recreate  # Ensures the PVC is released before a new pod mounts it
  template:
    metadata:
      labels:
        app: ubuntu-persistent
    spec:
      serviceAccountName: ubuntu-sa

      # Security context — requires anyuid SCC (see Prerequisites above)
      securityContext:
        runAsUser: 0
        fsGroup: 0

      containers:
        - name: ubuntu
          image: ubuntu:22.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              echo "==> [1/4] Installing system dependencies (curl, tar, gzip, ca-certificates, jq)..."
              apt-get update -qq
              apt-get install -y -qq curl tar gzip ca-certificates jq

              echo "==> [2/4] Installing OpenShift CLI (oc) and kubectl from OpenShift mirror..."
              curl -fsSLo /tmp/oc.tar.gz \
                "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
              tar -xzf /tmp/oc.tar.gz -C /usr/local/bin oc kubectl
              chmod +x /usr/local/bin/oc /usr/local/bin/kubectl
              rm -f /tmp/oc.tar.gz

              echo "==> [3/4] Installing Helm 3..."
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

              echo "==> [4/4] Tool versions installed:"
              oc version --client   2>/dev/null || true
              kubectl version --client 2>/dev/null || true
              helm version          2>/dev/null || true
              jq --version          2>/dev/null || true

              echo "==> All tools ready. Pod is running."
              sleep infinity

          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "2"
              memory: "8Gi"

          volumeMounts:
            - name: ubuntu-storage
              mountPath: /data         # Persistent data directory inside the container

          # startupProbe — waits up to 5 minutes for tool installation to complete
          startupProbe:
            exec:
              command: ["/bin/bash", "-c", "command -v oc && command -v kubectl && command -v helm && command -v jq"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20

          # Liveness probe — confirms the process is alive after tools are installed
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "command -v oc && command -v kubectl && command -v helm && command -v jq"]
            initialDelaySeconds: 0
            periodSeconds: 60
            failureThreshold: 3

      volumes:
        - name: ubuntu-storage
          persistentVolumeClaim:
            claimName: ubuntu-pvc

      # Restart policy for Deployment pods must be Always
      restartPolicy: Always
